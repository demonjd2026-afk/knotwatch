<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">knotwatch architecture</text>
  <text x="24" y="54" fill="#495057">One snapshot format separates what is QNX-specific from what is portable and tested on any host.</text>

  <!-- lane: QNX target -->
  <rect x="16" y="72" width="948" height="290" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="32" y="96" font-weight="bold" fill="#343a40">QNX OS 8.0 target (x86_64 or aarch64, QEMU or hardware)</text>

  <g>
    <rect x="32" y="112" width="200" height="104" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="32" y="112" width="200" height="6" rx="3" fill="#e03131"/>
    <text x="44" y="140" font-weight="bold" fill="#212529">procnto (process manager)</text>
    <text x="44" y="162" fill="#495057">/proc/&lt;pid&gt;/ctl</text>
    <text x="44" y="180" fill="#495057">DCMD_PROC_TIDSTATUS</text>
    <text x="44" y="198" fill="#495057">ConnectServerInfo()</text>
  </g>
  <g>
    <rect x="290" y="112" width="190" height="104" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="290" y="112" width="190" height="6" rx="3" fill="#e03131"/>
    <text x="302" y="140" font-weight="bold" fill="#212529">Collector</text>
    <text x="302" y="162" fill="#495057">src/qnx/collect.c</text>
    <text x="302" y="180" fill="#495057">thread states, what each</text>
    <text x="302" y="198" fill="#495057">waits on, all connections</text>
  </g>
  <g>
    <rect x="538" y="112" width="190" height="104" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="538" y="112" width="190" height="6" rx="3" fill="#1971c2"/>
    <text x="550" y="140" font-weight="bold" fill="#212529">Analysis core</text>
    <text x="550" y="162" fill="#495057">src/core/analyze.c</text>
    <text x="550" y="180" fill="#495057">knot detection, send graph,</text>
    <text x="550" y="198" fill="#495057">hierarchy and contract</text>
  </g>
  <g>
    <rect x="786" y="112" width="162" height="104" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="786" y="112" width="162" height="6" rx="3" fill="#1971c2"/>
    <text x="798" y="140" font-weight="bold" fill="#212529">Renderers</text>
    <text x="798" y="162" fill="#495057">src/core/render.c</text>
    <text x="798" y="180" fill="#495057">text, JSON, DOT</text>
  </g>
  <g>
    <rect x="538" y="252" width="410" height="94" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="538" y="252" width="410" height="6" rx="3" fill="#e03131"/>
    <text x="550" y="280" font-weight="bold" fill="#212529">Resource manager  (knotwatch watch)</text>
    <text x="550" y="302" fill="#495057">src/qnx/watch.c: timer pulse on the dispatch channel, slog2 events</text>
    <text x="550" y="322" fill="#495057">/dev/knotwatch/report   json   dot   snapshot</text>
  </g>
  <g>
    <rect x="32" y="252" width="410" height="94" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="32" y="252" width="410" height="6" rx="3" fill="#2f9e44"/>
    <text x="44" y="280" font-weight="bold" fill="#212529">Demo: a latent deadlock</text>
    <text x="44" y="302" fill="#495057">brake_ctl sends READ_SPEED to wheel_sensor (intended)</text>
    <text x="44" y="322" fill="#495057">wheel_sensor sends FAULT back to brake_ctl (the flaw)</text>
  </g>

  <line x1="232" y1="164" x2="288" y2="164" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="156" font-size="11" fill="#495057">devctl</text>
  <line x1="480" y1="164" x2="536" y2="164" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="484" y="156" font-size="11" fill="#495057">snapshot</text>
  <line x1="728" y1="164" x2="784" y2="164" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="731" y="156" font-size="11" fill="#495057">findings</text>
  <line x1="866" y1="216" x2="866" y2="250" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="874" y="238" font-size="11" fill="#495057">publish</text>
  <line x1="132" y1="252" x2="132" y2="218" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="140" y="240" font-size="11" fill="#495057">observed like any other process</text>

  <!-- lane: host -->
  <rect x="16" y="378" width="948" height="120" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="32" y="402" font-weight="bold" fill="#343a40">Any host (Linux, macOS) and CI</text>
  <g>
    <rect x="290" y="416" width="190" height="66" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="290" y="416" width="190" height="6" rx="3" fill="#f08c00"/>
    <text x="302" y="444" font-weight="bold" fill="#212529">Snapshot file (.kws)</text>
    <text x="302" y="464" fill="#495057">captured on the target</text>
  </g>
  <g>
    <rect x="538" y="416" width="190" height="66" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="538" y="416" width="190" height="6" rx="3" fill="#1971c2"/>
    <text x="550" y="444" font-weight="bold" fill="#212529">knotwatch analyze</text>
    <text x="550" y="464" fill="#495057">the same core, replayed</text>
  </g>
  <g>
    <rect x="786" y="416" width="162" height="66" rx="6" fill="#fff" stroke="#adb5bd"/>
    <rect x="786" y="416" width="162" height="6" rx="3" fill="#f08c00"/>
    <text x="798" y="444" font-weight="bold" fill="#212529">CI gate</text>
    <text x="798" y="464" fill="#495057">exit 0 / 1 / 2</text>
  </g>
  <line x1="461" y1="216" x2="461" y2="414" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="469" y="374" font-size="11" fill="#495057">knotwatch capture</text>
  <line x1="480" y1="449" x2="536" y2="449" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="728" y1="449" x2="784" y2="449" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="24" y="518" width="14" height="6" fill="#e03131"/><text x="46" y="526" fill="#343a40">QNX-specific code</text>
  <rect x="190" y="518" width="14" height="6" fill="#1971c2"/><text x="212" y="526" fill="#343a40">portable core (unit-tested)</text>
  <rect x="410" y="518" width="14" height="6" fill="#2f9e44"/><text x="432" y="526" fill="#343a40">demo processes</text>
  <rect x="560" y="518" width="14" height="6" fill="#f08c00"/><text x="582" y="526" fill="#343a40">files and CI</text>
  <line x1="700" y1="521" x2="740" y2="521" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4"/><text x="748" y="526" fill="#343a40">indirect / optional path</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
