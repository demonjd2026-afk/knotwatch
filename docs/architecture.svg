<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#495057"/></marker></defs>
<rect width="1120" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#212529">knotwatch architecture</text>
<text x="24" y="55" fill="#495057">A snapshot separates the QNX-specific collector from a portable analysis core, so the same analysis runs on the target, on a host and in CI.</text>
<rect x="16" y="72" width="1088" height="326" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
<text x="32" y="96" font-weight="bold" fill="#343a40">QNX OS 8.0 target  (x86_64 and aarch64le, verified in QEMU)</text>
<rect x="16" y="452" width="1088" height="166" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
<text x="290" y="476" font-weight="bold" fill="#343a40">Development host and CI  (Linux, macOS)</text>
<g><rect x="32" y="110" width="204" height="122" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="32" y="110" width="204" height="7" rx="3.5" fill="#2f9e44"/><text x="44" y="139" font-weight="bold" fill="#212529">Demo processes</text>
<text x="44" y="160" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">brake_ctl  ⇄  wheel_sensor</text>
<text x="44" y="178" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">motor_ctl  ⇄  logger</text>
<text x="44" y="196" fill="#495057">a lock held across a send</text>
</g>
<g><rect x="276" y="110" width="212" height="122" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="276" y="110" width="212" height="7" rx="3.5" fill="#495057"/><text x="288" y="139" font-weight="bold" fill="#212529">Process manager (procnto)</text>
<text x="288" y="160" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">/proc/&lt;pid&gt;/ctl</text>
<text x="288" y="178" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">DCMD_PROC_TIDSTATUS</text>
<text x="288" y="196" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">ConnectServerInfo()</text>
<text x="288" y="214" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">/proc/&lt;pid&gt;/as</text>
</g>
<g><rect x="528" y="110" width="200" height="122" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="528" y="110" width="200" height="7" rx="3.5" fill="#e03131"/><text x="540" y="139" font-weight="bold" fill="#212529">Collector</text>
<text x="540" y="160" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/qnx/collect.c</text>
<text x="540" y="178" fill="#495057">thread states, what each</text>
<text x="540" y="196" fill="#495057">waits on, connections,</text>
<text x="540" y="214" fill="#495057">mutex owners</text>
</g>
<g><rect x="768" y="110" width="170" height="122" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="768" y="110" width="170" height="7" rx="3.5" fill="#1c7ed6"/><text x="780" y="139" font-weight="bold" fill="#212529">Analysis core</text>
<text x="780" y="160" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/core/analyze.c</text>
<text x="780" y="178" fill="#495057">knots (deadlocks),</text>
<text x="780" y="196" fill="#495057">send graph, contract</text>
</g>
<g><rect x="978" y="110" width="110" height="122" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="978" y="110" width="110" height="7" rx="3.5" fill="#1c7ed6"/><text x="990" y="139" font-weight="bold" fill="#212529">Renderers</text>
<text x="990" y="160" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/core/</text>
<text x="990" y="178" fill="#495057">text, JSON,</text>
<text x="990" y="196" fill="#495057">DOT, snapshot</text>
</g>
<path d="M236 171 H274" fill="none" stroke="#495057" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M488 171 H526" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M728 171 H766" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M938 171 H976" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="256" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">observed like any process</text>
<text x="507" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">devctl, read</text>
<text x="747" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">snapshot</text>
<text x="957" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">findings</text>
<g><rect x="32" y="276" width="456" height="104" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="32" y="276" width="456" height="7" rx="3.5" fill="#495057"/><text x="44" y="305" font-weight="bold" fill="#212529">Command line  (knotwatch scan, capture, watch)</text>
<text x="44" y="326" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/cli/main.c</text>
<text x="44" y="344" fill="#495057">one scan prints a report and exits 0, 1 or 2;  capture prints the snapshot</text>
</g>
<g><rect x="528" y="276" width="200" height="104" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="528" y="276" width="200" height="7" rx="3.5" fill="#e03131"/><text x="540" y="305" font-weight="bold" fill="#212529">Privileges  (--user)</text>
<text x="540" y="326" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/qnx/privs.c</text>
<text x="540" y="344" fill="#495057">drops root, keeps only the</text>
<text x="540" y="362" fill="#495057">two abilities a scan needs</text>
</g>
<g><rect x="768" y="276" width="320" height="104" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="768" y="276" width="320" height="7" rx="3.5" fill="#e03131"/><text x="780" y="305" font-weight="bold" fill="#212529">Resource manager  (knotwatch watch)</text>
<text x="780" y="326" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">src/qnx/watch.c</text>
<text x="780" y="344" fill="#495057">timer pulse per scan, slog2 events</text>
<text x="780" y="362" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">/dev/knotwatch/report  json  dot  snapshot</text>
</g>
<path d="M1056 232 V274" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1048" y="258" text-anchor="end" font-size="12" font-style="italic" fill="#343a40">publish</text>
<path d="M628 276 V234" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M800 380 V416 H152 V484" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470" y="410" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">snapshot</text>
<path d="M868 380 V434 H628 V484" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="748" y="428" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">json</text>
<path d="M940 380 V484" fill="none" stroke="#495057" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="950" y="442" text-anchor="start" font-size="12" font-style="italic" fill="#343a40">json, for example over ssh</text>
<g><rect x="32" y="486" width="240" height="116" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="32" y="486" width="240" height="7" rx="3.5" fill="#1c7ed6"/><text x="44" y="515" font-weight="bold" fill="#212529">Snapshot replay</text>
<text x="44" y="536" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">knotwatch analyze system.kws</text>
<text x="44" y="554" fill="#495057">the same core, no target needed</text>
<text x="44" y="572" fill="#495057">unit-tested with make check</text>
</g>
<g><rect x="312" y="486" width="176" height="116" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="312" y="486" width="176" height="7" rx="3.5" fill="#f08c00"/><text x="324" y="515" font-weight="bold" fill="#212529">CI gate</text>
<text x="324" y="536" fill="#495057">exit status 0 / 1 / 2</text>
<text x="324" y="554" fill="#495057">a deadlock fails the job</text>
<text x="324" y="572" fill="#495057">instead of hanging it</text>
</g>
<g><rect x="528" y="486" width="200" height="116" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="528" y="486" width="200" height="7" rx="3.5" fill="#7048e8"/><text x="540" y="515" font-weight="bold" fill="#212529">Report viewer</text>
<text x="540" y="536" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">viewer/index.html</text>
<text x="540" y="554" fill="#495057">one self-contained page:</text>
<text x="540" y="572" fill="#495057">send graph and findings</text>
</g>
<g><rect x="768" y="486" width="176" height="116" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="768" y="486" width="176" height="7" rx="3.5" fill="#7048e8"/><text x="780" y="515" font-weight="bold" fill="#212529">MCP server</text>
<text x="780" y="536" fill="#495057" font-family="Menlo, Consolas, monospace" font-size="11.5">agent/knotwatch_mcp.py</text>
<text x="780" y="554" fill="#495057">status, finding, process</text>
<text x="780" y="572" fill="#495057">read-only</text>
</g>
<g><rect x="984" y="486" width="104" height="116" rx="7" fill="#fff" stroke="#adb5bd"/><rect x="984" y="486" width="104" height="7" rx="3.5" fill="#495057"/><text x="996" y="515" font-weight="bold" fill="#212529">AI assistant</text>
<text x="996" y="536" fill="#495057">asks what is</text>
<text x="996" y="554" fill="#495057">stuck, and</text>
<text x="996" y="572" fill="#495057">why</text>
</g>
<path d="M272 544 H310" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="291" y="535" text-anchor="middle" font-size="12" font-style="italic" fill="#343a40">exit</text>
<path d="M944 536 H982" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M982 556 H946" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24" y="644" width="22" height="7" rx="3.5" fill="#e03131"/><text x="54" y="652" fill="#495057">QNX-specific code</text>
<rect x="186.2" y="644" width="22" height="7" rx="3.5" fill="#1c7ed6"/><text x="216.2" y="652" fill="#495057">portable core</text>
<rect x="322.0" y="644" width="22" height="7" rx="3.5" fill="#495057"/><text x="352.0" y="652" fill="#495057">operating system, entry points, users</text>
<rect x="616.2" y="644" width="22" height="7" rx="3.5" fill="#2f9e44"/><text x="646.2" y="652" fill="#495057">demo processes</text>
<rect x="758.6" y="644" width="22" height="7" rx="3.5" fill="#7048e8"/><text x="788.6" y="652" fill="#495057">host tools</text>
<rect x="874.6" y="644" width="22" height="7" rx="3.5" fill="#f08c00"/><text x="904.6" y="652" fill="#495057">automation</text>
<path d="M24 676 H62" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="72" y="680" fill="#495057">data flow</text>
<path d="M160 676 H198" fill="none" stroke="#495057" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="208" y="680" fill="#495057">indirect or optional path</text>
